version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: decentralized-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-decentralized_host}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: decentralized-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: decentralized-api
    environment:
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-decentralized_host}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key}
      REDIS_URL: redis://redis:6379
      MAIL_SMTP_PORT: 25
      MAIL_SMTP_TLS_PORT: 587
      MAIL_IMAP_PORT: 993
      MAIL_IMAP_PLAIN_PORT: 143
      MAIL_FROM_DOMAIN: ${MAIL_FROM_DOMAIN:-localhost}
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:-your-encryption-key}
      MAIL_ATTACHMENT_STORAGE: /app/mail_attachments
      MAX_ATTACHMENT_SIZE_MB: 25
    ports:
      - "3001:3001"
      - "25:25"
      - "587:587"
      - "993:993"
      - "143:143"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api/src:/app/src
      - mail_attachments:/app/mail_attachments
    command: npm run dev

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: decentralized-web
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./web/src:/app/src

volumes:
  postgres_data:
  redis_data:
  mail_attachments:

networks:
  default:
    name: decentralized-network
