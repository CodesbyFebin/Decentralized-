name: Build & Test

on:
  push:
    branches: [ main, develop, claude/* ]
    paths:
      - 'web/**'
      - 'api/**'
      - 'cmd/**'
      - '.github/workflows/build-and-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'web/**'
      - 'api/**'
      - 'cmd/**'

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Run linting
        working-directory: web
        run: npm run lint --if-present || true

      - name: Run type check
        working-directory: web
        run: npm run type-check --if-present || true

      - name: Build
        working-directory: web
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts-node-${{ matrix.node-version }}
          path: web/dist/
          retention-days: 7

  build-backend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: api
        run: npm install --legacy-peer-deps

      - name: Run type check
        working-directory: api
        run: npm run typecheck --if-present || true

      - name: Build backend
        working-directory: api
        run: npm run build --if-present || true

  build-go:
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-node-18.x
          path: web/dist/

      - name: Build Go backend
        run: go build -trimpath -o bin/ ./cmd/...
        continue-on-error: true

  deploy-preview:
    needs: build-frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-node-18.x
          path: web/dist/

      - name: Comment PR with preview
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Build Successful!**\n\nThe Next.js application has been built successfully. The build artifacts are ready for deployment.\n\n**Build Details:**\n- Node.js version: 18.x\n- Build status: ✅ Passed\n- Artifacts uploaded: web/dist/'
            })
