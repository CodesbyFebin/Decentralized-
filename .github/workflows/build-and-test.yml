name: Build & Test

on:
  push:
    branches: [ main, develop, claude/* ]
    paths:
      - 'web/**'
      - '.github/workflows/build-and-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'web/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      
      - name: Install dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps
      
      - name: Run linting
        working-directory: web
        run: npm run lint --if-present || true
      
      - name: Run type check
        working-directory: web
        run: npm run type-check --if-present || true
      
      - name: Build
        working-directory: web
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts-node-${{ matrix.node-version }}
          path: web/dist/
          retention-days: 7

  deploy-preview:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-node-18.x
          path: web/dist/
      
      - name: Comment PR with preview
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Build Successful!**\n\nThe Next.js application has been built successfully. The build artifacts are ready for deployment.\n\n**Build Details:**\n- Node.js version: 18.x\n- Build status: ✅ Passed\n- Artifacts uploaded: web/dist/'
            })
