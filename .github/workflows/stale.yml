name: Close Stale Issues and PRs

on:
  schedule:
    - cron: "0 2 * * 0"  # Weekly on Sunday at 2 AM UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v8
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue has been inactive for 60 days. Please provide an update or it will be closed in 7 days."
          stale-pr-message: "This PR has been inactive for 30 days. Please update or it will be closed in 7 days."
          close-issue-message: "Closing due to inactivity."
          close-pr-message: "Closing due to inactivity."
          days-before-issue-stale: 60
          days-before-pr-stale: 30
          days-before-close: 7
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "documentation,good-first-issue,help-wanted,priority:high"
          exempt-pr-labels: "work-in-progress,priority:high"
          operations-per-run: 100
